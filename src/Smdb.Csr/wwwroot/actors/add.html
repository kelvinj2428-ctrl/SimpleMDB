<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Add Actor • Simple Movie Database</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="/styles/main.css" />
	<script type="module" src="/scripts/actors/add.js" defer></script>
</head>

<body>
	<header>
		<h1>Add Actor</h1>
		<nav>
			<ul>
				<li><a href="/" class="btn">Home</a></li>
				<li><a href="/actors/index.html" class="btn">All Actors</a></li>
			</ul>
		</nav>
	</header>

	<main class="container">
		<div id="status" class="status">New actor. Fill in the fields and click Create.</div>

		<form id="actor-form" class="grid">
			<div class="field">
				<label for="firstName">First Name</label>
				<input id="firstName" name="firstName" type="text" required />
			</div>
			<div class="field">
				<label for="lastName">Last Name</label>
				<input id="lastName" name="lastName" type="text" required />
			</div>
			<div class="field">
				<label for="rating">Rating (0–10)</label>
				<input id="rating" name="rating" type="number" min="0" max="10" step="0.1" value="0" />
			</div>
			<div class="field">
				<label for="bio">Bio</label>
				<textarea id="bio" name="bio" placeholder="Short biography…"></textarea>
			</div>
			<div class="form-actions">
				<button class="btn primary" type="submit">Create</button>
				<a class="btn" href="/actors/index.html">Cancel</a>
			</div>
		</form>
	</main>
</body>

</html>

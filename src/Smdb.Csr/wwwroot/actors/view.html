<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>View Actor • Simple Movie Database</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="/styles/main.css" />
	<script type="module" src="/scripts/actors/view.js" defer></script>
</head>

<body>
	<header>
		<h1>View Actor</h1>
		<nav>
			<ul>
				<li><a href="/" class="btn">Home</a></li>
				<li><a href="/actors/index.html" class="btn">All Actors</a></li>
				<li><a id="edit-link" class="btn">Edit</a></li>
			</ul>
		</nav>
	</header>

	<main class="container">
		<div id="status" class="status">Loading...</div>
		<table class="table">
			<tbody>
				<tr>
					<th>ID</th>
					<td id="actor-id">—</td>
				</tr>
				<tr>
					<th>First Name</th>
					<td id="actor-firstName">—</td>
				</tr>
				<tr>
					<th>Last Name</th>
					<td id="actor-lastName">—</td>
				</tr>
				<tr>
					<th>Rating</th>
					<td id="actor-rating">—</td>
				</tr>
				<tr>
					<th>Bio</th>
					<td id="actor-bio">—</td>
				</tr>
			</tbody>
		</table>

		<h2 style="margin-top:1.5rem; color:#a5d6a7;">Movies by this Actor</h2>
		<div id="movies-status" class="status">Loading movies...</div>
		<div id="movies-list" class="grid cards" style="margin-top:0.5rem;"></div>
	</main>

	<template id="movie-item">
		<div class="card">
			<h3>
				<span class="title"></span>
				<span class="badge year"></span>
			</h3>
			<p class="meta role-text"></p>
			<div class="row-actions">
				<a class="btn btn-view">View Movie</a>
			</div>
		</div>
	</template>
</body>

</html>
